get:
  summary: List all the request's reports
  description: List all the reports for the request.
  security:
    - basic_authentication: []
  parameters:
    - $ref: '../components/parameters/request.yaml#/RequestId'
  responses:
    '200':
      description: OK. The request has succeeded.
      content:
        application/xml; charset=utf-8:
          schema:
            $ref: '../components/schemas/reports.yaml'
          example: |
            <reports>
              <report bsrequest="18" id="7" category="spam" created_at="2026-09-18 10:04:50 UTC" updated_at="2026-09-18 10:04:50 UTC">a</report>
            </reports>
    '401':
      $ref: '../components/responses/unauthorized.yaml'
    '404':
      description: |
        Not found.

        XML Schema used for body validation: [status.rng](../schema/status.rng)
      content:
        application/xml; charset=utf-8:
          schema:
            $ref: '../components/schemas/api_response.yaml'
          examples:
            not_found:
              summary: Couldn't find Request with number '1234'
              value:
                code: not_found
                summary: Couldn't find Request with number '1234'
  tags:
    - Reports

post:
  summary: Create a request report
  description: Create a report for the request.
  security:
    - basic_authentication: []
  parameters:
    - $ref: '../components/parameters/request.yaml#/RequestId'
    - in: query
      name: category
      schema:
        type: string
        enum: [spam, scam, forbidden_license, illegal_content, other]
      description: Category of the report
      example: spam
  requestBody:
    description: Content of the report
    required: true
    content:
      text/plain:
        schema:
          type: string
        example: This is a very valuable report
  responses:
    '200':
      $ref: '../components/responses/succeeded.yaml'
    '400':
      description: |
        Invalid report.

        XML Schema used for body validation: [status.rng](../schema/status.rng)
      content:
        application/xml; charset=utf-8:
          schema:
            $ref: '../components/schemas/api_response.yaml'
    '401':
      $ref: '../components/responses/unauthorized.yaml'
    '404':
      description: |
        Not found.

        XML Schema used for body validation: [status.rng](../schema/status.rng)
      content:
        application/xml; charset=utf-8:
          schema:
            $ref: '../components/schemas/api_response.yaml'
          examples:
            not_found:
              summary: Couldn't find Request with number '1234'
              value:
                code: not_found
                summary: Couldn't find Request with number '1234'
  tags:
    - Reports
