get:
  summary: List all the user reports
  description: List all the user reports.
  security:
    - basic_authentication: []
  parameters:
    - $ref: '../components/parameters/login.yaml'
  responses:
    '200':
      description: OK. The request has succeeded.
      content:
        application/xml; charset=utf-8:
          schema:
            $ref: '../components/schemas/reports.yaml'
          example: |
            <reports>
              <report user="Admin" id="11" category="spam" created_at="2026-09-18 10:06:28 UTC" updated_at="2026-09-18 10:06:28 UTC">This user has been reported together with a comment they wrote. Report reason for the comment: </report>
            </reports>
    '401':
      $ref: '../components/responses/unauthorized.yaml'
  tags:
    - Reports

post:
  summary: Create a user report
  description: Create a report for the user.
  security:
    - basic_authentication: []
  parameters:
    - $ref: '../components/parameters/login.yaml'
    - in: query
      name: category
      schema:
        type: string
        enum: [spam, scam, forbidden_license, illegal_content, other]
      description: Category of the report
      example: spam
  requestBody:
    description: Content of the report
    required: true
    content:
      text/plain:
        schema:
          type: string
        example: This is a very valuable report
  responses:
    '200':
      $ref: '../components/responses/succeeded.yaml'
    '400':
      description: |
        Invalid report.

        XML Schema used for body validation: [status.rng](../schema/status.rng)
      content:
        application/xml; charset=utf-8:
          schema:
            $ref: '../components/schemas/api_response.yaml'
    '401':
      $ref: '../components/responses/unauthorized.yaml'
    '404':
      description: |
        Not found.

        XML Schema used for body validation: [status.rng](../schema/status.rng)
      content:
        application/xml; charset=utf-8:
          schema:
            $ref: '../components/schemas/api_response.yaml'
          examples:
            not_found:
              summary: Couldn't find User with login 'Admin'
              value:
                code: not_found
                summary: Couldn't find User with login 'Admin'
  tags:
    - Reports
