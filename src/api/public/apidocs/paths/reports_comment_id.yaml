get:
  summary: List all the comment's reports
  description: List all the reports for the comment.
  security:
    - basic_authentication: []
  parameters:
    - in: path
      name: comment_id
      schema:
        type: integer
      required: false
      description: Id of the comment.
      example: 1124
  responses:
    '200':
      description: OK. The comment has succeeded.
      content:
        application/xml; charset=utf-8:
          schema:
            $ref: '../components/schemas/reports.yaml'
          example: |
            <reports>
              <report comment="3" id="1" category="other" created_at="2026-08-28 14:37:52 UTC" updated_at="2026-08-28 14:37:59 UTC">Watch your language, please</report>
              <report comment="3" id="6" category="other" created_at="2026-08-28 14:38:00 UTC" updated_at="2026-08-28 14:38:01 UTC">Behave properly, please!</report>
            </reports>
    '401':
      $ref: '../components/responses/unauthorized.yaml'
    '404':
      description: |
        Not found.

        XML Schema used for body validation: [status.rng](../schema/status.rng)
      content:
        application/xml; charset=utf-8:
          schema:
            $ref: '../components/schemas/api_response.yaml'
          examples:
            not_found:
              summary: Couldn't find Comment with id '1234'
              value:
                code: not_found
                summary: Couldn't find Comment with id '1234'
  tags:
    - Reports

post:
  summary: Create a comment report
  description: Create a report for the comment.
  security:
    - basic_authentication: []
  parameters:
    - in: path
      name: comment_id
      schema:
        type: integer
      required: true
      description: Id of the comment.
      example: 1124
    - in: query
      name: category
      schema:
        type: string
        enum: [spam, scam, forbidden_license, illegal_content, other]
      description: Category of the report
      example: spam
  requestBody:
    description: Content of the report
    required: true
    content:
      text/plain:
        schema:
          type: string
        example: This is a very valuable report
  responses:
    '200':
      $ref: '../components/responses/succeeded.yaml'
    '400':
      description: |
        Invalid report.

        XML Schema used for body validation: [status.rng](../schema/status.rng)
      content:
        application/xml; charset=utf-8:
          schema:
            $ref: '../components/schemas/api_response.yaml'
    '401':
      $ref: '../components/responses/unauthorized.yaml'
    '404':
      description: |
        Not found.

        XML Schema used for body validation: [status.rng](../schema/status.rng)
      content:
        application/xml; charset=utf-8:
          schema:
            $ref: '../components/schemas/api_response.yaml'
          examples:
            not_found:
              summary: Couldn't find Comment with id '1234'
              value:
                code: not_found
                summary: Couldn't find Comment with id '1234'
  tags:
    - Reports
