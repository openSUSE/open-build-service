name: Update Ruby

on:
  schedule:
    # Runs at 03:00 UTC every Monday
    - cron: '0 3 * * 1'
  workflow_dispatch: # Allows manual testing from the "Actions" tab

jobs:
  update-ruby:
    runs-on: ubuntu-latest
    container: ruby:latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Update Ruby
        run: dist/update_ruby

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): update ruby version"
          title: "Automated Ruby Update"
          branch: automated-ruby-update
          delete-branch: true
          body: |
            This is an automated PR triggered by the weekly scheduled task.
            It runs `dist/update_ruby` in a checkout.
