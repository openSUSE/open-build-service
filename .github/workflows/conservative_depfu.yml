name: Conservative Gem Updates Check

on:
- pull_request_target

jobs:
  make_conservative:
    # Only run on PRs opened by Depfu or Dependabot
    if: github.actor == 'depfu[bot]' || github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          # Fetch depth 0 to allow clean git history handling
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Identify updated gem name
        id: parse_gem
        run: |
          # Extracts gem name from standard Depfu/Dependabot branch names 
          # (e.g. depfu/update-rubocop-1.2.0 or dependabot/bundler/rubocop-1.2.0)
          BRANCH_NAME="${{ github.event.pull_request.head.ref }}"
          
          # Extracts the primary gem name from the branch name pattern
          GEM_NAME=$(echo "$BRANCH_NAME" | sed -E 's#^.*/##; s/([a-zA-Z0-9_-]+)-[0-9].*/\1/')
          
          if [ -z "$GEM_NAME" ]; then
            echo "::warning title=Gem Parsing Failed::Could not extract gem name from branch '$BRANCH_NAME'."
            exit 0
          fi

          echo "gem_name=$GEM_NAME" >> $GITHUB_OUTPUT
          echo "Identified target gem: $GEM_NAME"

      - name: Check for non-conservative diff
        run: |
          GEM_NAME="${{ steps.parse_gem.outputs.gem_name }}"

          # Navigate to the directory containing the Gemfile and Gemfile.lock
          cd src/api

          # Step 1: Reset Gemfile.lock to the base branch state (e.g., main/master)
          git checkout "origin/${{ github.event.pull_request.base.ref }}" -- Gemfile.lock

          # Step 2: Perform the conservative update locally in the action workspace
          if ! bundle update --conservative "$GEM_NAME"; then
            echo "::warning title=Bundler Error::Failed to run 'bundle update --conservative $GEM_NAME'."
            exit 0
          fi

          # Step 3: Compare the conservative lockfile against Depfu's proposed lockfile
          # Re-fetch PR's original Gemfile.lock into a temporary file for comparison
          git show "HEAD:Gemfile.lock" > Gemfile.lock.depfu

          if ! diff -q Gemfile.lock Gemfile.lock.depfu > /dev/null; then
            echo "::warning title=Non-Conservative Diff Detected::Depfu PR for '$GEM_NAME' contains unneeded transitive dependency updates. Running 'bundle update --conservative $GEM_NAME' locally produces a cleaner diff."
          else
            echo "Lockfile matches the conservative result. No extra dependencies modified."
          fi
